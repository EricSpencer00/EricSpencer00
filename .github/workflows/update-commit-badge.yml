name: Update Commit Badge

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs every 4 hours
  workflow_dispatch:  # Allows manual triggering

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install PyGithub
        run: pip install PyGithub
      
      - name: Test authored-commit lookup
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Update badge from the latest Eric-authored commit
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python update_commit_badge.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add recent-commit.json commit-url.txt README.md
          if ! git diff --staged --quiet; then
            git commit -m "Update commit badge"
            git push
          fi
